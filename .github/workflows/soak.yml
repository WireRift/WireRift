name: Scheduled Soak and Fault Tests

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Soak duration (Go duration, e.g. 30m or 2h)
        required: false
        default: 30m

permissions:
  contents: read

concurrency:
  group: scheduled-soak
  cancel-in-progress: false

jobs:
  soak:
    name: 30-minute Soak and Network Faults
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Deterministic latency, drop, partition, and half-open faults
        run: go run ./test/fault/

      - name: Sustained tunnel soak
        env:
          SOAK_DURATION: ${{ inputs.duration || '30m' }}
        run: go run ./test/soak/ -duration "$SOAK_DURATION" -window 1m -workers 5
