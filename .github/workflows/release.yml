name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: false

      # CI (lint, race, fuzz, coverage, three OSes, Docker build) has to have
      # passed on exactly the commit being released.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --workflow CI --commit "$GITHUB_SHA" --json conclusion -q '[.[]|select(.conclusion=="success")]|length')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; wait for it (or fix it), then re-run this workflow"
            exit 1
          fi

      - name: Run tests
        run: |
          go vet ./cmd/... ./internal/...
          go test -race ./cmd/... ./internal/... ./test/integration/ -timeout 300s

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE=$(git show -s --format=%cI "$GITHUB_SHA")
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT::8} -X main.date=${DATE}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
            "freebsd/amd64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            target_os="${platform%/*}"
            target_arch="${platform#*/}"
            export GOOS="$target_os"
            export GOARCH="$target_arch"

            ext=""
            if [ "$target_os" = "windows" ]; then
              ext=".exe"
            fi

            echo "Building ${target_os}/${target_arch}..."

            # Build client
            go build -ldflags="$LDFLAGS" \
              -o "dist/wirerift-${target_os}-${target_arch}${ext}" \
              ./cmd/wirerift

            # Build server
            go build -ldflags="$LDFLAGS" \
              -o "dist/wirerift-server-${target_os}-${target_arch}${ext}" \
              ./cmd/wirerift-server
          done

      - name: Create archives
        run: |
          cd dist
          for f in wirerift-*; do
            if [[ "$f" == *.exe ]]; then
              zip "${f%.exe}.zip" "$f"
            else
              tar czf "${f}.tar.gz" "$f"
              chmod +x "$f"
            fi
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum wirerift-* > checksums.txt
          cat checksums.txt

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: WireRift v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/wirerift-*
            dist/checksums.txt
          body: |
            ## WireRift v${{ steps.version.outputs.VERSION }}

            ### Installation

            **Go Install:**
            ```bash
            go install github.com/wirerift/wirerift/cmd/wirerift@v${{ steps.version.outputs.VERSION }}
            go install github.com/wirerift/wirerift/cmd/wirerift-server@v${{ steps.version.outputs.VERSION }}
            ```

            **Binary Download:**
            Download the appropriate binary for your platform from the assets below.

            | Platform | Client | Server |
            |----------|--------|--------|
            | Linux x64 | `wirerift-linux-amd64` | `wirerift-server-linux-amd64` |
            | Linux ARM64 | `wirerift-linux-arm64` | `wirerift-server-linux-arm64` |
            | macOS x64 | `wirerift-darwin-amd64` | `wirerift-server-darwin-amd64` |
            | macOS ARM64 (M1/M2) | `wirerift-darwin-arm64` | `wirerift-server-darwin-arm64` |
            | Windows x64 | `wirerift-windows-amd64.exe` | `wirerift-server-windows-amd64.exe` |
            | Windows ARM64 | `wirerift-windows-arm64.exe` | `wirerift-server-windows-arm64.exe` |
            | FreeBSD x64 | `wirerift-freebsd-amd64` | `wirerift-server-freebsd-amd64` |

            ### Verify Checksums
            ```bash
            sha256sum -c checksums.txt
            gh attestation verify wirerift-linux-amd64 --repo WireRift/WireRift
            ```

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: meta
        run: |
          echo "COMMIT=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.meta.outputs.COMMIT }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          tags: |
            ghcr.io/wirerift/wirerift:${{ steps.version.outputs.VERSION }}
            ghcr.io/wirerift/wirerift:latest

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/wirerift/wirerift
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
