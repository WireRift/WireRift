name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      # CI (lint, race, fuzz, coverage, three OSes, Docker build) has to have
      # passed on exactly the commit being released.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --workflow CI --commit "$GITHUB_SHA" --json conclusion -q '[.[]|select(.conclusion=="success")]|length')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; wait for it (or fix it), then re-run this workflow"
            exit 1
          fi

      - name: Run tests
        run: |
          go vet ./cmd/... ./internal/...
          go test -race ./cmd/... ./internal/... ./test/integration/ -timeout 300s

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT::8} -X main.date=${DATE}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "linux/arm"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
            "freebsd/amd64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"

            ext=""
            if [ "$GOOS" = "windows" ]; then
              ext=".exe"
            fi

            echo "Building ${GOOS}/${GOARCH}..."

            # Build client
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="$LDFLAGS" \
              -o "dist/wirerift-${GOOS}-${GOARCH}${ext}" \
              ./cmd/wirerift

            # Build server
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="$LDFLAGS" \
              -o "dist/wirerift-server-${GOOS}-${GOARCH}${ext}" \
              ./cmd/wirerift-server
          done

      - name: Create archives
        run: |
          cd dist
          for f in wirerift-*; do
            if [[ "$f" == *.exe ]]; then
              zip "${f%.exe}.zip" "$f"
            else
              tar czf "${f}.tar.gz" "$f"
              chmod +x "$f"
            fi
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum wirerift-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WireRift v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/wirerift-*
            dist/checksums.txt
          body: |
            ## WireRift v${{ steps.version.outputs.VERSION }}

            ### Installation

            **Go Install:**
            ```bash
            go install github.com/wirerift/wirerift/cmd/wirerift@v${{ steps.version.outputs.VERSION }}
            go install github.com/wirerift/wirerift/cmd/wirerift-server@v${{ steps.version.outputs.VERSION }}
            ```

            **Binary Download:**
            Download the appropriate binary for your platform from the assets below.

            | Platform | Client | Server |
            |----------|--------|--------|
            | Linux x64 | `wirerift-linux-amd64` | `wirerift-server-linux-amd64` |
            | Linux ARM64 | `wirerift-linux-arm64` | `wirerift-server-linux-arm64` |
            | macOS x64 | `wirerift-darwin-amd64` | `wirerift-server-darwin-amd64` |
            | macOS ARM64 (M1/M2) | `wirerift-darwin-arm64` | `wirerift-server-darwin-arm64` |
            | Windows x64 | `wirerift-windows-amd64.exe` | `wirerift-server-windows-amd64.exe` |
            | Windows ARM64 | `wirerift-windows-arm64.exe` | `wirerift-server-windows-arm64.exe` |
            | FreeBSD x64 | `wirerift-freebsd-amd64` | `wirerift-server-freebsd-amd64` |

            ### Verify Checksums
            ```bash
            sha256sum -c checksums.txt
            ```

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: meta
        run: echo "COMMIT=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.meta.outputs.COMMIT }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/wirerift/wirerift:${{ steps.version.outputs.VERSION }}
            ghcr.io/wirerift/wirerift:latest
